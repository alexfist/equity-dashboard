# Render Blueprint for the FastAPI backend (the frontend lives on Vercel).
# Render does not read the Procfile, so the start command is explicit here.
services:
  - type: web
    name: equity-dashboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/company/VRTX
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Exact Vercel production URL, no trailing slash. Comma-separate to add more.
      - key: ALLOWED_ORIGINS
        value: https://equity-dashboard-ten.vercel.app
      # Paste your Finnhub key in the Render dashboard; never commit it.
      - key: FINNHUB_KEY
        sync: false
      # Optional: a real contact email for SEC EDGAR's User-Agent requirement.
      - key: SEC_USER_AGENT
        sync: false
